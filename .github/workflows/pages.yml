# main に push されるたびに、このリポジトリの中身を GitHub Pages へ配信する。
#
# configure-pages の enablement: true が Pages 自体の有効化も行うので、
# Settings → Pages を手で開いて設定する必要はない。
# 必要なのはリポジトリが Public であることだけ（無料プランでは Private は Pages 非対応）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions タブから手動でも流せるようにしておく

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は1つずつ。走行中のものは走りきらせる（途中で切るとPagesが半端な状態になる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 配信するファイルだけ _site にまとめる
        # README や .github は配信不要なので、必要なものだけを明示的に集める
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest registerSW.js sw.js favicon.svg .nojekyll _site/
          cp -r icons _site/
          ls -la _site

      - name: Pages を有効化して設定を取得
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 配信
        id: deployment
        uses: actions/deploy-pages@v4
